services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8020:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/data:/app/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  mcp:
    build:
      context: ./mcp_server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8021:8021"
    environment:
      - MEAL_API_BASE_URL=http://backend:8000/api
      - MEAL_USER_EMAIL=wajahatahmad056@gmail.com
      - MEAL_USER_PASSWORD=Wajahat@MealTrack2026!
      - PORT=8021
    depends_on:
      - backend

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8022:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.frontend.conf:/etc/nginx/conf.d/default.conf:ro
